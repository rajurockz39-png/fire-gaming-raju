const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadData() {
  try {
    const local = localStorage.getItem('fg_products');
    if (local) {
      const parsed = JSON.parse(local);
      if (parsed && Array.isArray(parsed.products)) return parsed;
    }
  } catch (_) {}
  if (window.FG_DATA) return window.FG_DATA;
  return (await fetch('products.json', {cache: 'no-store'})).json();
}

function waLink(shop, p) {
  const text = `Hi FIREGAMINGRAJU! I want to buy *${p.name}* (${money(p.price)}). Is it still available?`;
  return `https://wa.me/${shop.whatsapp}?text=${encodeURIComponent(text)}`;
}

let ALL = [];   // every photo for this product
let IDX = 0;

function stageHTML(p, photos) {
  const sold = p.available === false;
  return `
    <div class="gallery">
      <div class="stage">
        <img id="stageImg" src="${esc(p.image || photos[0] || '')}" alt="${esc(p.name)} main photo">
        ${sold ? '<div class="sold-veil"><span>SOLD OUT</span></div>' : ''}
        <div class="counter" id="counter">1 / ${photos.length}</div>
        <button class="zoom" id="zoomBtn">⤢ View Full</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>`;
}

function renderThumbs(p, photos) {
  const t = document.getElementById('thumbs');
  t.innerHTML = photos.map((src, i) => `
    <button class="${i === IDX ? 'on' : ''}" data-i="${i}" aria-label="Photo ${i + 1}">
      <img src="${esc(src)}" alt="" loading="lazy">
    </button>`).join('') +
    Array.from({length: Math.max(0, 10 - photos.length)}).map(() =>
      `<button class="empty" disabled>+</button>`).join('');

  t.querySelectorAll('button[data-i]').forEach(b => {
    b.addEventListener('click', () => setPhoto(+b.dataset.i));
  });
}

function setPhoto(i) {
  IDX = i;
  const img = document.getElementById('stageImg');
  img.src = ALL[i];
  document.getElementById('counter').textContent = `${i + 1} / ${ALL.length}`;
  document.querySelectorAll('#thumbs button[data-i]').forEach(b => {
    b.classList.toggle('on', +b.dataset.i === i);
  });
}

function openLB(i) {
  const lb = document.getElementById('lb');
  lb.dataset.i = i;
  document.getElementById('lbImg').src = ALL[i];
  document.getElementById('lbCapt').textContent = `${i + 1} of ${ALL.length}`;
  lb.classList.add('open');
}
function closeLB() { document.getElementById('lb').classList.remove('open'); }
function shiftLB(d) {
  const lb = document.getElementById('lb');
  let i = (+lb.dataset.i + d + ALL.length) % ALL.length;
  lb.dataset.i = i;
  document.getElementById('lbImg').src = ALL[i];
  document.getElementById('lbCapt').textContent = `${i + 1} of ${ALL.length}`;
}

document.getElementById('lbX').addEventListener('click', closeLB);
document.getElementById('lb').addEventListener('click', e => { if (e.target.id === 'lb') closeLB(); });
document.getElementById('lbPrev').addEventListener('click', () => shiftLB(-1));
document.getElementById('lbNext').addEventListener('click', () => shiftLB(1));
document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') shiftLB(-1);

});

  if (!p) {
    app.innerHTML = `<div class="notfound"><h1>ID Not Found</h1>
      <p>This account may have been sold or removed.</p>
      <a href="index.html#ids">See All Available IDs</a></div>`;
    return;
  }

  const sold = p.available === false;
  // main photo first, then every gallery photo
  ALL = [p.image, ...(p.gallery || [])].filter(Boolean);
  if (!ALL.length) ALL = [''];

  const hasVideo = !!(p.video && p.video.trim());
  const features = (p.features || []).map(f => `<li>${esc(f)}</li>`).join('');
  const was = p.mrp && Number(p.mrp) > Number(p.price) ? Number(p.mrp) : 0;
  const off = was ? Math.round((1 - Number(p.price) / was) * 100) : 0;

  app.innerHTML = `
    <div class="crumbs"><a href="index.html">Home</a><i>/</i><a href="index.html#ids">IDs For Sale</a><i>/</i>${esc(p.name)}</div>
    <div class="detail">
      <div>${ALL[0] ? stageHTML(p, ALL) : ''}</div>
      <div class="info">
        <h1>${esc(p.name)}</h1>
        <div class="priceline">
          <span class="now">${money(p.price)}</span>
          ${was ? `<span class="was">${money(was)}</span><span class="off">${off}% off</span>` : ''}
        </div>
        <div class="status ${sold ? 'out' : 'live'}">
          ${sold ? '● Sold Out' : '<span class="dot"></span> Available Now'}
        </div>

        <div class="buyrow">
          ${sold
            ? `<button class="btn" disabled>Sold Out</button>`
            : `<a class="btn btn-wa" href="${waLink(shop, p)}" target="_blank" rel="noopener">${WA_ICON} Buy Now on WhatsApp</a>`}
          ${hasVideo
            ? `<a class="btn btn-video" href="${esc(p.video)}" target="_blank" rel="noopener">
                 <span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
                 Watch Full Video
               </a>`
            : `<button class="btn btn-video" disabled title="Video coming soon">
                 <span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
                 Video Coming Soon
               </button>`}
        </div>

        ${features ? `<div class="specs"><h2>Account Details</h2><ul>${features}</ul></div>` : ''}

        <div class="trust-mini">
          <div class="tm"><b>🛡️</b>100% Safe</div>
          <div class="tm"><b>⚡</b>Fast Delivery</div>
          <div class="tm"><b>🤝</b>Hand to Hand</div>
        </div>
      </div>
    </div>

    <section class="gallery-sec">
      <h2 class="display">All Photos</h2>
      <p class="sub">${(p.gallery || []).length + (p.image ? 1 : 0)} screenshots of this account. Tap any photo to view full screen.</p>
      <div class="shot-grid" id="shotGrid"></div>
    </section>
  `;

  // thumbnails + stage
  if (ALL[0]) {
    renderThumbs(p, ALL);
    document.getElementById('zoomBtn').addEventListener('click', () => openLB(IDX));
    document.getElementById('stageImg').addEventListener('click', () => openLB(IDX));
  }

  // detail shot grid
  const grid = document.getElementById('shotGrid');
  if (ALL.length > 1) {
    grid.innerHTML = ALL.map((src, i) => `
      <div class="shot-item" data-i="${i}">
        <span class="n">${i + 1}</span>
        <img src="${esc(src)}" alt="Photo ${i + 1}" loading="lazy">
      </div>`).join('');
    grid.querySelectorAll('.shot-item').forEach(el => {
      el.addEventListener('click', () => openLB(+el.dataset.i));
    });
  } else {
    grid.innerHTML = `<div class="shot-empty">More photos for this ID are being added.<br>Message us on WhatsApp and we'll send them right away.</div>`;
  }

  // mobile sticky buy
  document.getElementById('mobileBuy').innerHTML = `
    <span class="price">${money(p.price)}</span>
    ${sold
      ? `<button class="btn" disabled>Sold Out</button>`
      : `<a class="btn btn-wa" href="${waLink(shop, p)}" target="_blank" rel="noopener">${WA_ICON} Buy Now</a>`}
    ${hasVideo ? `<a class="btn btn-video" style="flex:0 0 auto;width:auto;padding:13px 15px" href="${esc(p.video)}" target="_blank" rel="noopener" aria-label="Watch video">
        <span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></a>` : ''}
  `;

  document.title = `${p.name} — ${money(p.price)} | FIREGAMINGRAJU`;
})();
</script>

</body>
</html>
