<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeBomb } from './cast3d.js';
import { makeMonkey, makeBulldog, makeRooster } from './animals3d.js';
const W=1080,H=1920;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap;
r.toneMapping=THREE.NeutralToneMapping; r.toneMappingExposure=1.05; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color(0x5cc8ff); s.fog=new THREE.Fog(0x9fe0ff,10,30);
s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture; s.environmentIntensity=0.5;

ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; s.add(ground);
const P=makeBulldog(); P.root.position.set(-0.55,0,-0.2); P.root.rotation.y=0.3; s.add(P.root);
const B=makeMonkey(); B.root.position.set(0.2,0,0.35); B.root.rotation.y=-0.1; s.add(B.root);
const K=makeRooster(); K.root.position.set(0.68,0,0.8); K.root.rotation.y=-0.45; s.add(K.root);
const bomb=makeBomb(); bomb.root.position.set(0.0,0,1.0); s.add(bomb.root);
B.rig.smile.visible=false; B.rig.grin.visible=true; B.rig.arms[1].rotation.z=-2.4; B.rig.brows.forEach((b,i)=>b.rotation.z=(i?-1:1)*-0.3);
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100); cam.position.set(0,1.2,7.6); cam.lookAt(0,0.6,0);
r.render(s,cam); window.done=true;
</script></body></html>
