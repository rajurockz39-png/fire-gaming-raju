<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      @font-face { font-family: "Fredoka"; src: url("Fredoka.woff2") format("woff2"); font-weight: 600; }
      body {
        font-family: "Fredoka", sans-serif;
      }
      #hook { position: absolute; left: 90px; right: 90px; top: 1330px; text-align: center;
        font-size: 84px; font-weight: 600; color: #fff; line-height: 1.1;
        background: #1b1b22; border: 8px solid #fff; border-radius: 60px; padding: 26px 30px; }
      #hook span { color: #ffe14a; }
      #bar { position: absolute; left: 0; top: 0; width: 1080px; height: 14px; background: rgba(0,0,0,0.35); }
      #barfill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff3b30, #ffd23f); transform-origin: left center; }
      code,
      pre,
      .monospace {
        font-family: "JetBrains Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="amma_chappal_preview.mp4"
        playsinline
        data-start="0"
        data-duration="31"
        data-track-index="0"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover" data-has-audio="true"></video>
      

      <div id="hook" class="clip" data-start="0" data-duration="3.2" data-track-index="1">WAIT FOR THE <span>TWIST</span> 😹</div>
      <div id="bar" class="clip" data-start="0" data-duration="31" data-track-index="2"><div id="barfill"></div></div>
      <!--
        Add your clips here. Example:
        <div id="title" class="clip" data-start="0" data-duration="5" data-track-index="1"
             style="font-size: 64px; color: #fff; padding: 40px">
          Hello World
        </div>
      -->
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#hook", { y: -220, scale: 0.4, opacity: 0, duration: 0.55, ease: "back.out(2.2)" }, 0.15);
      tl.to("#hook", { scale: 1.08, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, 0.8);
      tl.to("#hook", { y: -80, opacity: 0, duration: 0.35, ease: "power2.in" }, 2.8);
      tl.fromTo("#barfill", { scaleX: 0 }, { scaleX: 1, duration: 31, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
