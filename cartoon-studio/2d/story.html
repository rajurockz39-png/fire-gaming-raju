<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// story.html?ep=duck_story (default) | ep02_rain ...
const ep = new URLSearchParams(location.search).get('ep') || 'duck_story';
const mod = await import(`./${ep}.js`);
const { drawFrame, preload, DURATION } = mod;
if (new URLSearchParams(location.search).get('fx') === '1') (await import('./duck_story.js')).FX.on = true;
const ctx = document.getElementById('c').getContext('2d');
await preload();
window.DURATION = DURATION;
window.render = (t) => drawFrame(ctx, t);
window.ready = true;
</script></body></html>
