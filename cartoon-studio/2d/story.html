<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { drawFrame, preload, DURATION } from './duck_story.js';
const ctx = document.getElementById('c').getContext('2d');
await preload();
window.DURATION = DURATION;
window.render = (t) => drawFrame(ctx, t);
window.ready = true;
</script></body></html>
